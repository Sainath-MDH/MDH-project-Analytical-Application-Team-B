<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Theft Analyst Dashboard</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- Plotly.js for Visualization -->
    <script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading Dataset...</p>
    </div>

    <!-- Header -->
    <header>
        <h1>Bike Theft Analyst Dashboard</h1>
        <div>
            <!-- Add future filters/controls here if needed -->
            <button onclick="location.reload()" style="padding: 0.5rem 1rem; background: #334155; color: white; border: none; border-radius: 4px; cursor: pointer;">Refresh Data</button>
        </div>
    </header>

    <!-- KPI Section -->
    <section class="kpi-container">
        <div class="card">
            <div class="kpi-title">Total Incidents</div>
            <div id="kpi-incidents" class="kpi-value">-</div>
        </div>
        <div class="card">
            <div class="kpi-title">Total Financial Damage</div>
            <div id="kpi-damage" class="kpi-value">-</div>
        </div>
        <div class="card">
            <div class="kpi-title">Avg. Damage per Theft</div>
            <div id="kpi-avg" class="kpi-value">-</div>
        </div>
    </section>

    <!-- Main Charts Grid -->
    <main class="charts-grid">
        <!-- Trend Chart (Wide) -->
        <div class="chart-card wide-chart">
            <div id="trendChart" style="width:100%; height:100%;"></div>
        </div>
        
        <!-- Category Chart -->
        <div class="chart-card">
            <div id="categoryChart" style="width:100%; height:100%;"></div>
        </div>

        <!-- Offence Type Chart -->
        <div class="chart-card">
            <div id="offenceChart" style="width:100%; height:100%;"></div>
        </div>
    </main>

    <!-- App Logic -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
