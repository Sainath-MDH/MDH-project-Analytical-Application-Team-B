<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter</title>
    <meta name="description" content="A minimal, premium click counter application.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium dark theme palette */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --glow: rgba(99, 102, 241, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 3.5rem;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 420px;
            animation: floatIn 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            font-weight: 300;
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .counter-wrapper {
            position: relative;
            margin-bottom: 3rem;
        }

        .counter-display {
            font-size: 7rem;
            font-weight: 600;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(to bottom right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: block;
        }

        .counter-display.bump {
            transform: scale(1.15);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1.25rem 3.5rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px -5px var(--glow);
            font-family: inherit;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.02em;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -8px var(--glow);
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px var(--glow);
        }

        .btn:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Counter</h1>
        <div class="counter-wrapper">
            <span id="count" class="counter-display">0</span>
        </div>
        <button id="increment-btn" class="btn" type="button">Tap to Count</button>
    </main>

    <script>
        const countDisplay = document.getElementById('count');
        const incrementBtn = document.getElementById('increment-btn');
        let count = 0;

        incrementBtn.addEventListener('click', () => {
            count++;
            countDisplay.innerText = count;

            // Trigger animation
            countDisplay.classList.remove('bump');
            // Force reflow
            void countDisplay.offsetWidth;
            countDisplay.classList.add('bump');
        });
    </script>
</body>

</html>
